<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>YVR South Runway Monitor</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131a29;
      --text: #f8fafc;
      --muted: #8492a6;
      --takeoff: #f59e0b;
      --takeoff-bg: rgba(245, 158, 11, 0.15);
      --landing: #10b981;
      --landing-bg: rgba(16, 185, 129, 0.15);
      --route-bg: #1c2638;
      --border: rgba(255,255,255,0.08);
    }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    .board {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .radar-pulse {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      box-shadow: 0 0 10px #10b981;
    }
    .card {
      background: var(--card-bg);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    .state-banner {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .state-takeoff { background: var(--takeoff-bg); color: var(--takeoff); border-bottom: 2px solid var(--takeoff); }
    .state-landing { background: var(--landing-bg); color: var(--landing); border-bottom: 2px solid var(--landing); }
    .state-level { background: rgba(148, 163, 184, 0.15); color: var(--muted); border-bottom: 2px solid var(--muted); }

    .route-bar {
      background: var(--route-bg);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .airport-node {
      display: flex;
      flex-direction: column;
      max-width: 42%;
    }
    .airport-node.right { text-align: right; }
    .airport-code {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.03em;
    }
    .airport-city {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .route-arrow {
      color: var(--muted);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
    }

    .photo-stage {
      width: 100%;
      height: 300px;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .photo-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .flight-identity {
      padding: 16px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .callsign-group {
      display: flex;
      flex-direction: column;
    }
    .callsign {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .airline-name {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .logo-badge {
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 75px;
      height: 34px;
    }
    .logo-badge img {
      max-height: 28px;
      max-width: 90px;
      object-fit: contain;
    }
    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 10px 20px 20px;
    }
    .data-cell {
      background: rgba(255,255,255,0.03);
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
    }
    .data-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 3px;
    }
    .data-val {
      font-size: 1.05rem;
      font-weight: 700;
    }

    /* Idle Scanning UI */
    .scan-screen {
      padding: 50px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }
    .radar-sweep {
      width: 70px;
      height: 70px;
      border: 2px solid rgba(16, 185, 129, 0.4);
      border-radius: 50%;
      position: relative;
      animation: pulse-ring 2.5s infinite ease-out;
    }
    .radar-sweep::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      background: #10b981;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.7); opacity: 0.3; }
      50% { transform: scale(1.1); opacity: 0.8; }
      100% { transform: scale(0.7); opacity: 0.3; }
    }
    .scan-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }
    .scan-sub {
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 320px;
      line-height: 1.4;
    }
    .feed-info {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="board">
  <div class="header-bar">
    <div><span class="radar-pulse"></span> Richmond Corridor (08R/26L)</div>
    <div id="clock">--:--:--</div>
  </div>

  <div class="card" id="flight-card">
    <div class="scan-screen">
      <div class="radar-sweep"></div>
      <div class="scan-title">Connecting to Airspace</div>
      <div class="scan-sub">Acquiring OpenSky Network radar telemetry...</div>
    </div>
  </div>

  <div class="feed-info" id="feed-status">Scanning live frequencies...</div>
</div>

<script>
  // Richmond corridor bounding box (Steveston to Fraser North Arm; Strait of Georgia to Hwy 91)
  const LAMIN = 49.1100;
  const LAMAX = 49.2300;
  const LOMIN = -123.2800;
  const LOMAX = -123.0200;
  const ALT_CEILING_FT = 5000;

  const AIRLINE_REGISTRY = {
    ACA: { name: "Air Canada", iata: "AC" },
    WJA: { name: "WestJet", iata: "WS" },
    FLE: { name: "Flair Airlines", iata: "F8" },
    JZA: { name: "Air Canada Express", iata: "QK" },
    CJT: { name: "Cargojet", iata: "W8" },
    PCO: { name: "Pacific Coastal", iata: "8P" },
    FDX: { name: "FedEx", iata: "FX" },
    UPS: { name: "UPS Airlines", iata: "5X" },
    DAL: { name: "Delta Air Lines", iata: "DL" },
    UAL: { name: "United Airlines", iata: "UA" },
    AAL: { name: "American Airlines", iata: "AA" },
    ASA: { name: "Alaska Airlines", iata: "AS" },
    CPA: { name: "Cathay Pacific", iata: "CX" },
    EVA: { name: "EVA Air", iata: "BR" },
    CAL: { name: "China Airlines", iata: "CI" },
    KAL: { name: "Korean Air", iata: "KE" },
    AAR: { name: "Asiana Airlines", iata: "OZ" },
    ANA: { name: "All Nippon Airways", iata: "NH" },
    JAL: { name: "Japan Airlines", iata: "JL" },
    BAW: { name: "British Airways", iata: "BA" },
    DLH: { name: "Lufthansa", iata: "LH" },
    AFR: { name: "Air France", iata: "AF" },
    KLM: { name: "KLM", iata: "KL" },
    ANZ: { name: "Air New Zealand", iata: "NZ" },
    QFA: { name: "Qantas", iata: "QF" },
    AMX: { name: "Aeroméxico", iata: "AM" },
    TSC: { name: "Air Transat", iata: "TS" },
    SWG: { name: "Sunwing Airlines", iata: "WG" },
    CHH: { name: "Hainan Airlines", iata: "HU" },
    CSN: { name: "China Southern", iata: "CZ" },
    CES: { name: "China Eastern", iata: "MU" },
    XMN: { name: "XiamenAir", iata: "MF" }
  };

  const photoStore = new Map();
  const routeStore = new Map();

  async function pollAirspace() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString();

    try {
      const url = `https://opensky-network.org/api/states/all?lamin=${LAMIN}&lomin=${LOMIN}&lamax=${LAMAX}&lomax=${LOMAX}`;
      const res = await fetch(url);
      
      if (!res.ok) {
        throw new Error(`OpenSky status ${res.status}`);
      }

      const data = await res.json();
      document.getElementById('feed-status').textContent = `Connected: OpenSky Network · Updated ${new Date().toLocaleTimeString()}`;

      if (!data.states || data.states.length === 0) {
        renderClearState("Corridor Clear", "No aircraft detected in Richmond corridor.");
        return;
      }

      // Parse OpenSky array format:
      // [0] icao24, [1] callsign, [5] lon, [6] lat, [7] baro_alt (m), [8] on_ground, [9] velocity (m/s), [10] true_track, [11] vertical_rate (m/s)
      const planes = data.states.map(s => {
        const altM = s[7];
        const altFt = altM !== null ? Math.round(altM * 3.28084) : (s[8] ? 0 : null);
        const vRateMps = s[11] || 0;
        const vRateFpm = Math.round(vRateMps * 196.85);
        const gsKts = s[9] !== null ? Math.round(s[9] * 1.94384) : null;
        const track = s[10] !== null ? Math.round(s[10]) : null;

        return {
          hex: s[0],
          callsign: (s[1] || "").trim(),
          alt_ft: altFt,
          on_ground: s[8],
          vertical_rate_fpm: vRateFpm,
          gs_kts: gsKts,
          track: track
        };
      });

      // Filter traffic below altitude ceiling (or on ground)
      const activePlanes = planes.filter(p => {
        if (p.on_ground) return true;
        return p.alt_ft !== null && p.alt_ft <= ALT_CEILING_FT;
      });

      if (activePlanes.length === 0) {
        renderClearState("Corridor Clear", `All nearby aircraft are above ${ALT_CEILING_FT.toLocaleString()} ft.`);
        return;
      }

      // Prioritize the lowest aircraft
      const target = activePlanes.sort((a, b) => (a.alt_ft || 0) - (b.alt_ft || 0))[0];

      const [photoData, route] = await Promise.all([
        fetchPhoto(target.hex),
        fetchRoute(target.callsign)
      ]);

      renderDisplay(target, photoData, route);
    } catch (err) {
      document.getElementById('feed-status').textContent = `Reconnecting radar stream... (${err.message})`;
    }
  }

  async function fetchRoute(callsign) {
    if (!callsign) return null;
    if (routeStore.has(callsign)) return routeStore.get(callsign);

    try {
      const res = await fetch(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(callsign)}`);
      if (res.ok) {
        const data = await res.json();
        if (data?.response?.flightroute) {
          const fr = data.response.flightroute;
          const routeData = {
            originCode: fr.origin?.iata_code || fr.origin?.icao_code || "DEP",
            originCity: fr.origin?.municipality || fr.origin?.name || "Origin",
            destCode: fr.destination?.iata_code || fr.destination?.icao_code || "ARR",
            destCity: fr.destination?.municipality || fr.destination?.name || "Destination"
          };
          routeStore.set(callsign, routeData);
          return routeData;
        }
      }
    } catch (e) {}

    routeStore.set(callsign, null);
    return null;
  }

  async function fetchPhoto(hex) {
    if (!hex) return null;
    if (photoStore.has(hex)) return photoStore.get(hex);

    try {
      const res = await fetch(`https://api.planespotters.net/pub/photos/hex/${hex}`);
      if (res.ok) {
        const json = await res.json();
        if (json.photos && json.photos.length > 0) {
          const item = json.photos[0];
          const result = {
            url: item.thumbnail_large ? item.thumbnail_large.src : null,
            model: item.airplane ? item.airplane.model : (item.aircraft_type || null)
          };
          photoStore.set(hex, result);
          return result;
        }
      }
    } catch (e) {}
    return null;
  }

  function renderClearState(title, subtitle) {
    document.getElementById('flight-card').innerHTML = `
      <div class="scan-screen">
        <div class="radar-sweep"></div>
        <div class="scan-title">${title}</div>
        <div class="scan-sub">${subtitle}</div>
      </div>
    `;
  }

  function renderDisplay(plane, photoData, route) {
    const rawCallsign = plane.callsign || plane.hex.toUpperCase();
    const icaoPrefix = rawCallsign.slice(0, 3).toUpperCase();
    const carrier = AIRLINE_REGISTRY[icaoPrefix] || { name: "General / Private", iata: null };

    const vRate = plane.vertical_rate_fpm || 0;
    let stateClass = "state-level";
    let stateLabel = "✈️ LEVEL / EN ROUTE";
    let stateRate = `${Math.abs(vRate)} ft/min`;

    const isLanding = vRate <= -150;
    const isTakeoff = vRate >= 150;

    if (isLanding) {
      stateClass = "state-landing";
      stateLabel = "🛬 LANDING (APPROACH)";
      stateRate = `▼ ${Math.abs(vRate).toLocaleString()} ft/min`;
    } else if (isTakeoff) {
      stateClass = "state-takeoff";
      stateLabel = "🛫 TAKEOFF (DEPARTING)";
      stateRate = `▲ +${vRate.toLocaleString()} ft/min`;
    }

    let originCode = "---", originCity = "Unknown";
    let destCode = "---", destCity = "Unknown";

    if (route) {
      originCode = route.originCode;
      originCity = route.originCity;
      destCode = route.destCode;
      destCity = route.destCity;
    } else {
      if (isLanding) {
        originCode = "???"; originCity = "Inbound";
        destCode = "YVR"; destCity = "Vancouver";
      } else if (isTakeoff) {
        originCode = "YVR"; originCity = "Vancouver";
        destCode = "???"; destCity = "Outbound";
      }
    }

    const logoHtml = carrier.iata 
      ? `<div class="logo-badge">
           <img src="https://pics.avs.io/200/80/${carrier.iata}.png" 
                onerror="this.onerror=null; this.src='https://images.kiwi.com/airlines/64/${carrier.iata}.png';" 
                alt="${carrier.name}">
         </div>`
      : ``;

    const photoHtml = (photoData && photoData.url)
      ? `<img src="${photoData.url}" alt="${rawCallsign}">`
      : `<div style="color:var(--muted)">No photograph on file for ${plane.hex.toUpperCase()}</div>`;

    const aircraftModel = (photoData && photoData.model) ? photoData.model : "Aircraft";

    const altDisplay = plane.on_ground 
      ? "Tarmac / Ground" 
      : `${plane.alt_ft.toLocaleString()} ft`;

    document.getElementById('flight-card').innerHTML = `
      <div class="state-banner ${stateClass}">
        <div>${stateLabel}</div>
        <div>${stateRate}</div>
      </div>

      <div class="route-bar">
        <div class="airport-node">
          <span class="airport-code">${originCode}</span>
          <span class="airport-city">${originCity}</span>
        </div>
        <div class="route-arrow">➔</div>
        <div class="airport-node right">
          <span class="airport-code">${destCode}</span>
          <span class="airport-city">${destCity}</span>
        </div>
      </div>

      <div class="photo-stage">
        ${photoHtml}
      </div>

      <div class="flight-identity">
        <div class="callsign-group">
          <span class="callsign">${rawCallsign}</span>
          <span class="airline-name">${carrier.name}</span>
        </div>
        ${logoHtml}
      </div>

      <div class="telemetry-grid">
        <div class="data-cell">
          <span class="data-label">Aircraft Type</span>
          <span class="data-val">${aircraftModel}</span>
        </div>
        <div class="data-cell">
          <span class="data-label">Altitude</span>
          <span class="data-val">${altDisplay}</span>
        </div>
        <div class="data-cell">
          <span class="data-label">Ground Speed</span>
          <span class="data-val">${plane.gs_kts ? plane.gs_kts + " kts" : "—"}</span>
        </div>
        <div class="data-cell">
          <span class="data-label">ICAO Hex</span>
          <span class="data-val">${plane.hex.toUpperCase()}</span>
        </div>
        <div class="data-cell">
          <span class="data-label">Track / Heading</span>
          <span class="data-val">${plane.track ? plane.track + "°" : "—"}</span>
        </div>
        <div class="data-cell">
          <span class="data-label">Runway Vector</span>
          <span class="data-val">${(plane.track && plane.track > 180) ? "08R Vector" : "26L Vector"}</span>
        </div>
      </div>
    `;
  }

  // OpenSky anonymous rate limit is 1 request per 10s
  async function pollLoop() {
    await pollAirspace();
    setTimeout(pollLoop, 10000);
  }

  pollLoop();
</script>
</body>
</html>
